<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Clipward">
  <title>Clipward</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1C21"/><stop offset="1" stop-color="#0C0D10"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="84" y="84" width="856" height="856" rx="196" fill="url(#tile)"/>
  <rect x="85.5" y="85.5" width="853" height="853" rx="194.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <defs>
    <clipPath id="icon-left"><polygon points="0,0 542,0 446,1024 0,1024"/></clipPath>
    <clipPath id="icon-right"><polygon points="578,0 1024,0 1024,1024 482,1024"/></clipPath>
  </defs>
  <g transform="translate(0 30)"><rect x="300" y="392" width="424" height="240" rx="56" fill="#F4F5F7" clip-path="url(#icon-left)"/></g>
  <g transform="translate(0 -30)"><rect x="300" y="392" width="424" height="240" rx="56" fill="#F4F5F7" clip-path="url(#icon-right)"/></g>
</svg>
